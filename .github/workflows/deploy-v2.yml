name: Deploy v2 (microservices)
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths-ignore: ['*.md']

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd /home/club/Club
          git pull
      - name: Copy maintenance page
        run: |
          sudo cp /home/club/Club/maintenance.html /usr/share/nginx/html/maintenance.html
      - name: Enable maintenance mode
        run: |
          cd /home/club/Club
          sudo ./maintenance.sh on
      - name: Cleanup before build
        run: |
          cd /home/club/Club
          docker stop dnd-club t21-game 2>/dev/null || true
          docker rm -f dnd-club t21-game 2>/dev/null || true
          # legacy services, removed from the stack
          docker rm -f dnd-book-club dnd-book-club-2 g21-club quest english 2>/dev/null || true
          sudo rm -rf /home/club/Club/uploads/g21
      - name: Build dnd-club
        run: cd /home/club/Club && docker compose -f docker-compose.prod.yml build dnd-club
      - name: Prune build cache
        run: docker builder prune -af
      - name: Build t21-game
        run: cd /home/club/Club && docker compose -f docker-compose.prod.yml build t21-game
      - name: Restart app services (db untouched)
        run: |
          cd /home/club/Club
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
      - name: Sync Prisma schema
        run: |
          cd /home/club/Club
          for i in $(seq 1 30); do
            docker compose -f docker-compose.prod.yml exec -T dnd-club-db \
              sh -c "PGPASSWORD=dndclub_pass pg_isready -U dndclub -d dndclub" && break
            sleep 2
          done
          # legacy databases, no longer used
          docker compose -f docker-compose.prod.yml exec -T dnd-club-db \
            psql -U dndclub -d postgres -c 'DROP DATABASE IF EXISTS bookclub2;' \
              -c 'DROP DATABASE IF EXISTS gameclub;' \
              -c 'DROP DATABASE IF EXISTS bookclub;'
          docker compose -f docker-compose.prod.yml exec -T dnd-club \
            npx prisma db push
          docker compose -f docker-compose.prod.yml restart dnd-club
      - name: Disable maintenance mode
        if: always()
        run: |
          cd /home/club/Club
          sudo ./maintenance.sh off
      - name: Update nginx and reload
        run: |
          sudo cp /home/club/Club/dnd-club-nginx.conf /etc/nginx/sites-enabled/dnd-club
          sudo nginx -t && sudo systemctl reload nginx
      - name: Cleanup Docker
        if: always()
        run: docker system prune -af
